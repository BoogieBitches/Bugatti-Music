services:
  - type: web
    name: bugatti-audio-processor
    runtime: python
    rootDir: audio-processor
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 10000
    healthCheckPath: /audio/health
    autoDeploy: true
